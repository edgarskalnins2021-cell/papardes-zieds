<style>
:root{
  --ink:#23305e;          /* zila tinte — burtnīcas teksts */
  --paper:#eef0e6;        /* rūtiņu burtnīcas papīrs */
  --grid:rgba(70,110,170,.16);
  --margin:#c9473d;       /* sarkanā malas līnija */
  --enamel:#1e5b63;       /* emaljētas pogas */
  --amber:#ff9a3c;        /* filmas datuma zīmogs, uguns */
  --font-display:"Old Standard TT","Times New Roman",Georgia,serif;
  --font-body:"PT Sans","Trebuchet MS",system-ui,sans-serif;
  /* izkārtojums: pilnekrāna glezna; HUD stūros; paneļi = skolas rūtiņu burtnīcas lapas */
  --sceneB:80px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#16121d;color:#f6efe0;font-family:var(--font-body);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.gone{display:none!important}

/* ---------- HUD ---------- */
#hud,#controls,#stamp{display:none}
body.playing #hud{display:flex}
body.playing #controls{display:block}
body.playing #stamp{display:block}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px) 0 calc(env(safe-area-inset-left) + 10px);pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(2,auto);gap:4px 10px;padding:6px 9px;border-radius:12px;background:rgba(20,16,28,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.stat{display:flex;align-items:center;gap:5px}
.stat img{width:16px;height:16px}
.bar{display:block;width:58px;height:7px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden}
.bar i{display:block;height:100%;width:50%;border-radius:4px;transition:width .4s}
#s-hp i{background:#e0574a}#s-food i{background:#d9a24a}#s-warm i{background:#f08a3a}#s-en i{background:#c9d65a}
.stat.low .bar{animation:pulse 1s infinite}
@keyframes pulse{50%{background:rgba(255,80,60,.55)}}
#quest{pointer-events:auto;max-width:min(42vw,380px);min-height:34px;padding:6px 12px;border-radius:14px;border:1px solid rgba(255,214,140,.35);background:rgba(35,48,94,.8);font-size:13px;line-height:1.25;text-align:left;color:#fbf3e2}
#quest b{display:block;font:italic 700 11px var(--font-display);letter-spacing:.6px;color:var(--amber);text-transform:uppercase}
.info{display:flex;align-items:center;gap:9px;padding:5px 5px 5px 10px;border-radius:12px;background:rgba(20,16,28,.45);font-size:13px;pointer-events:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
#clock{font-weight:700;font-size:15px}
#bMenu{background:none;border:none;padding:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
#bMenu img{width:22px;height:22px}
#stamp{position:fixed;right:calc(env(safe-area-inset-right) + 18px);bottom:max(calc(var(--sceneB) + 12px),118px);z-index:4;font:700 17px/1 "Courier New",monospace;letter-spacing:3px;color:var(--amber);text-shadow:0 0 6px rgba(255,120,30,.75),0 0 1px #ffd2a0;opacity:.85;pointer-events:none;white-space:pre}
body.portrait .bar{width:46px}
body.portrait #money{display:none}
body.portrait #quest{order:3;flex-basis:100%;max-width:none}

/* ---------- vadība ---------- */
#controls{position:fixed;left:0;right:0;bottom:0;height:0;z-index:6}
.mv{position:fixed;left:calc(env(safe-area-inset-left) + 14px);bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:12px}
.mv button{width:72px;height:72px;border-radius:50%;border:2px solid rgba(255,240,210,.35);background:rgba(30,91,99,.74);font-size:26px;color:#fff3dc;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.mv button.on{background:rgba(30,91,99,.96);transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
#bAct{position:fixed;right:calc(env(safe-area-inset-right) + 16px);bottom:calc(env(safe-area-inset-bottom) + 14px);width:94px;height:94px;border-radius:50%;border:3px solid rgba(255,214,140,.75);background:radial-gradient(circle at 35% 30%,#ecb75c,#b9642e 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:12.5px;line-height:1.05;color:#fff8ea;box-shadow:0 5px 0 rgba(0,0,0,.35);text-shadow:0 1px 1px rgba(0,0,0,.45);padding:4px;transition:opacity .2s,filter .2s}
#bAct img{width:36px;height:36px}
#bAct:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
#bAct.dis{filter:grayscale(.65) brightness(.88)}
#bAct.idle{opacity:.5}
#bAct.hot{animation:hot .3s infinite alternate}
@keyframes hot{to{transform:scale(1.08)}}
.tools{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:8px}
.tools button{width:58px;height:58px;border-radius:14px;border:2px solid rgba(255,240,210,.28);background:rgba(35,48,94,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;padding:3px;color:#fbf3e2}
.tools img{width:30px;height:30px}
body.portrait .tools{bottom:calc(env(safe-area-inset-bottom) + 120px)}
#vpad{position:fixed;right:calc(env(safe-area-inset-right) + 122px);bottom:calc(env(safe-area-inset-bottom) + 14px);display:none;flex-direction:column;gap:8px}
body.vert #vpad{display:flex}
#vpad button{width:60px;height:56px;border-radius:16px;border:2px solid rgba(255,240,210,.35);background:rgba(30,91,99,.74);font-size:22px;color:#fff3dc;box-shadow:0 4px 0 rgba(0,0,0,.35)}
#vpad button.on{background:rgba(30,91,99,.96);transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
body.portrait #vpad{flex-direction:row;right:calc(env(safe-area-inset-right) + 16px);bottom:calc(env(safe-area-inset-bottom) + 190px)}

/* ---------- paziņojumi ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 62px);width:min(520px,calc(100% - 24px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:12}
body.portrait #toasts{top:calc(env(safe-area-inset-top) + 104px)}
.toast{padding:7px 13px;border-radius:12px;background:rgba(20,16,28,.84);color:#fbf3e2;font-size:14px;line-height:1.3;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.3);animation:tin .25s ease-out;transition:opacity .5s}
.toast.ok{background:rgba(30,91,99,.94)}
.toast.bad{background:rgba(140,40,30,.9)}
.toast.out{opacity:0}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

/* ---------- burtnīcas lapa (dialogs, paneļi) ---------- */
.nb{color:var(--ink);background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:14px 14px;position:relative}
.nb::before{content:"";position:absolute;top:0;bottom:0;left:30px;width:2px;background:var(--margin);opacity:.7;pointer-events:none}
#dialog{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 56px);width:min(620px,calc(100% - 24px));z-index:15;padding:11px 18px 14px 44px;border-radius:6px 14px 14px 6px;box-shadow:0 10px 30px rgba(0,0,0,.5);cursor:pointer}
body.portrait #dialog{top:auto;bottom:calc(env(safe-area-inset-bottom) + 10px)}
#dlgWho{font:italic 700 15px var(--font-display);color:var(--margin);margin-bottom:2px}
#dlgTxt{font-size:16.5px;line-height:1.42;text-wrap:pretty}
#dlgWho.gpa{color:#2f6a3a}#dlgWho.radio{color:var(--enamel)}#dlgWho.shop{color:#8a4a8a}
#dlgImg{float:right;width:64px;height:64px;margin:2px 0 6px 10px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#dlgCh{display:flex;flex-direction:column;gap:6px}
#dialog.menu{cursor:default}
#dialog.menu .next{display:none}
#dialog.menu #dlgTxt:empty{display:none}
.ch{display:block;width:100%;text-align:left;padding:9px 12px 9px 26px;border-radius:10px;border:1px solid rgba(35,48,94,.28);background:rgba(255,255,255,.78);color:var(--ink);font-size:15px;line-height:1.25;position:relative;font-weight:700}
.ch::before{content:"▸";position:absolute;left:10px;color:var(--margin)}
.ch.end{font-weight:400;color:#3d4a78}
.ch:active{background:#fff}
#dialog .next{position:absolute;right:12px;bottom:5px;font-size:11px;opacity:.6;animation:bob 1s infinite alternate}
@keyframes bob{to{transform:translateY(3px)}}
#panel{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(10,8,14,.58);padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 10px)}
.sheet{width:min(600px,100%);max-height:100%;display:flex;flex-direction:column;border-radius:6px 14px 14px 6px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.sheet header{display:flex;align-items:center;gap:10px;padding:10px 10px 6px 44px;position:relative}
.sheet h2{flex:1;margin:0;font:700 23px/1.1 var(--font-display);letter-spacing:.3px;text-wrap:balance}
#pClose{width:42px;height:42px;border-radius:50%;border:none;background:rgba(35,48,94,.12);color:var(--ink);font-size:18px;flex:none}
.sheet .body{overflow:auto;padding:4px 14px 18px 44px;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;user-select:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 3px;border-radius:10px;background:rgba(255,255,255,.66);border:1px solid rgba(35,48,94,.16);font-size:11px;text-align:center;line-height:1.1;color:var(--ink);min-height:74px}
.cell img{width:38px;height:38px}
.cell .n{position:absolute;top:3px;right:5px;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.cell.sel{outline:2px solid var(--margin);background:#fff}
.detail{margin:12px 0 4px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.8);border:1px solid rgba(35,48,94,.18)}
.detail h3{margin:0 0 3px;font:700 18px var(--font-display)}
.detail p{margin:0 0 8px;font-size:14px;line-height:1.35}
.btn{border:none;border-radius:10px;padding:9px 13px;font-weight:700;font-size:14px;background:var(--enamel);color:#fdf6e6;box-shadow:0 3px 0 rgba(0,0,0,.25);flex:none;white-space:nowrap}
.btn:disabled{background:#a9b0b3;box-shadow:none;color:#f4f4f4}
.btn.red{background:var(--margin)}
.btn.ghost{background:rgba(35,48,94,.14);color:var(--ink);box-shadow:none}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:8px;border-radius:10px;background:rgba(255,255,255,.66);border:1px solid rgba(35,48,94,.14)}
.row.ok{background:rgba(255,255,255,.9);border-color:rgba(30,91,99,.45)}
.row.warn{border-color:var(--margin)}
.row img.big{width:42px;height:42px;flex:none}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:700;font-size:15px}
.row .d{font-size:12.5px;line-height:1.3;color:#3d4a78;margin-top:1px}
.row .r{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:4px;font-size:12px}
.req{display:inline-flex;align-items:center;gap:2px;padding:1px 7px 1px 2px;border-radius:8px;background:rgba(35,48,94,.08);font-variant-numeric:tabular-nums}
.req img{width:18px;height:18px}
.req.no{color:var(--margin);font-weight:700}
.tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:8px;font-size:11px;background:rgba(201,71,61,.12);color:var(--margin);font-weight:700;vertical-align:1px}
.tag.okt{background:rgba(30,91,99,.15);color:var(--enamel)}
.sect{margin:16px 0 6px;font:700 17px var(--font-display);color:var(--ink);border-bottom:1px solid rgba(35,48,94,.25);padding-bottom:2px}
.sub2,.empty{font-size:13.5px;line-height:1.4;color:#3d4a78;margin:6px 0 10px}
.date{font:italic 15px var(--font-display);margin:2px 0 4px}
.q{display:flex;gap:8px;padding:4px 0;font-size:14px;line-height:1.3}
.q .ck{flex:none;width:18px;height:18px;border:1.5px solid var(--ink);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--margin);font-weight:700;background:rgba(255,255,255,.6)}
.q.done{color:#6a74a0}
.q.cur{font-weight:700}
.hint{font-size:14px;color:#2f3f7a;font-style:italic;margin:2px 0 6px 26px;line-height:1.4}
.tips{margin:4px 0;padding-left:18px}
.tips li{margin-bottom:5px;font-size:13.5px;line-height:1.35}
.map{position:relative;height:28px;border-radius:5px;display:flex;margin:6px 0 2px;border:1px solid rgba(35,48,94,.3)}
.map span{display:block;height:100%}
.map span:first-child{border-radius:4px 0 0 4px}.map span:last-child{border-radius:0 4px 4px 0}
.map .me{position:absolute;top:-4px;width:3px;height:34px;background:var(--margin);border-radius:2px}
.map .tg{position:absolute;top:7px;width:14px;height:14px;border-radius:50%;background:var(--amber);border:2px solid var(--ink)}
.mapl{display:flex;font-size:10px;color:#3d4a78}
.mapl span{overflow:hidden;white-space:nowrap;text-overflow:clip;text-align:center}
.tr{display:flex;flex-wrap:wrap;gap:8px}
.tr .cell{width:80px}
.tr .cell.miss img{filter:grayscale(1) brightness(.4) opacity(.35)}
.fr{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.bar2{flex:1;height:9px;border-radius:5px;background:rgba(35,48,94,.15);overflow:hidden}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,#8fb35a,#ffd56a)}
.cnt{font-weight:400;color:#3d4a78}
.qc{margin:0 0 10px;padding:9px 11px 7px;border-radius:10px;background:rgba(255,255,255,.7);border:1px solid rgba(35,48,94,.16)}
.qc.trk{border:2px solid var(--amber);background:rgba(255,250,236,.92)}
.qh{display:flex;align-items:center;gap:8px}
.qt{flex:1;min-width:0}
.qt b{display:block;font:700 17px/1.15 var(--font-display)}
.qk{display:block;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--margin);font-weight:700}
.qj{margin:6px 0 4px;font:italic 14px/1.42 var(--font-display);color:#2f3f7a}
.qc.done{padding:7px 11px}
.qc.done summary{cursor:pointer;font-weight:700;color:#6a74a0;font-size:14px}
.btn.sm{padding:6px 10px;font-size:12.5px}
.mapc{display:block;width:100%;height:auto;border-radius:6px;margin:6px 0}
.pzsig{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0}
.pzsig figure{margin:0;text-align:center;font-size:11.5px;max-width:92px}
.pzsig img{width:52px;height:52px;border-radius:6px;display:block;margin:0 auto 2px}
#puz{position:fixed;inset:0;z-index:22;display:flex;align-items:center;justify-content:center;background:rgba(10,8,14,.72);padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 8px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 8px)}
.pz{width:min(780px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;align-items:center;padding:12px 16px 14px 44px;border-radius:6px 14px 14px 6px;box-shadow:0 18px 50px rgba(0,0,0,.55);touch-action:pan-y}
.pzh{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.pzh h2{flex:1;margin:0;font:700 21px var(--font-display)}
#pzc{width:min(64vh,330px);height:auto;aspect-ratio:1;border-radius:50%;box-shadow:0 6px 18px rgba(0,0,0,.45);justify-self:center}
body.portrait .pz{grid-template-columns:1fr}
body.portrait #pzc{width:min(76vw,340px)}
.pzrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0}
.pzrow span{flex:1;text-align:center;font-weight:700;font-size:14px}
.pzrow .btn{width:54px;height:40px;font-size:17px;padding:0}
#pzHint p{margin:5px 0;font-size:13px;line-height:1.35}
#pzHint .pzsig img{width:42px;height:42px}

/* ---------- aizkari un ekrāni ---------- */
#fade{position:fixed;inset:0;z-index:30;background:#07060a;display:flex;align-items:center;justify-content:center;padding:30px;transition:opacity .8s}
#fade.off{opacity:0;pointer-events:none}
#fade p{max-width:520px;text-align:center;font:italic 22px/1.45 var(--font-display);color:#f1e4c8}
#screen{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(env(safe-area-inset-top) + 20px) calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 20px) calc(env(safe-area-inset-left) + 20px);text-align:center;background:linear-gradient(180deg,rgba(14,12,20,.05) 0%,rgba(14,12,20,.35) 45%,rgba(14,12,20,.82) 100%);overflow:auto}
#screen.loading{background:#16121d}
#screen.end{background:radial-gradient(ellipse at 50% 40%,rgba(255,150,70,.25),rgba(10,8,14,.88) 70%)}
.title{font:italic 400 clamp(46px,10.5vw,104px)/.95 var(--font-display);color:#fff2d6;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 34px rgba(255,170,90,.4);margin:0;text-wrap:balance}
.sub{margin:0;font:400 clamp(14px,3.4vw,20px) var(--font-display);color:#f3e2c2;letter-spacing:3px;text-transform:uppercase}
.year{margin:0;font:700 16px "Courier New",monospace;color:var(--amber);letter-spacing:5px;text-shadow:0 0 6px rgba(255,120,30,.7)}
.howto{max-width:540px;margin:4px 0;font-size:15px;line-height:1.5;color:#f1e6d2;text-shadow:0 1px 2px rgba(0,0,0,.6);text-wrap:pretty}
.stat3{font-size:14px;color:#ffd9a8;margin:0}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:4px}
.go{min-width:200px;padding:14px 26px;border-radius:30px;border:2px solid rgba(255,220,160,.8);background:radial-gradient(circle at 35% 30%,#ecb75c,#b9642e 75%);color:#fff8ea;font-weight:700;font-size:17px;box-shadow:0 5px 0 rgba(0,0,0,.35);text-shadow:0 1px 1px rgba(0,0,0,.4)}
.go.alt{background:rgba(35,48,94,.85);border-color:rgba(255,240,210,.4)}
.rot{margin:2px 0 0;font-size:12.5px;color:#e9cfa6;opacity:.85}
.prog{width:min(320px,70vw);height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--amber);transition:width .2s}
@media (prefers-reduced-motion:reduce){.toast,#bAct.hot,#dialog .next{animation:none}}
/* Sētas istabas un priekšmetu apskate */
#dlgTxt{font-size:18px}
.ch{min-height:44px}
#panel.farm-panel .sheet{width:min(850px,100%)}

<script>
'use strict';
const DL = {"n_intro1":{"s":"nar","t":"1989. gada 16. jūnijs, piektdiena.","v":"Tūkstoš deviņsimt astoņdesmit devītā gada sešpadsmitais jūnijs, piektdiena."},"n_intro2":{"s":"nar","t":"Tu esi Liene. Tu esi atbraukusi pie vecmāmiņas uz laukiem. Somas kabatā vēl čaukst autobusa biļete."},"n_intro3":{"s":"nar","t":"No pagalma dzird vecmāmiņu. Tu vēl neesi tikusi līdz durvīm, bet viņa jau ir tevi pamanījusi."},"n_shed1":{"s":"nar","t":"Starp veciem grābekļiem un siena dakšām tu atrodi vectēva cirvja asmeni un lāpstu."},"n_shed2":{"s":"nar","t":"Cirvim vajag kātu — pietiks ar diviem stipriem zariem."},"n_attic1":{"s":"nar","t":"Bēniņos smaržo pēc putekļiem un vecām avīzēm."},"n_attic2":{"s":"nar","t":"Te ir vectēva petrolejas lampa un radio “Spīdola” — tikai bez baterijas."},"n_attic3":{"s":"nar","t":"Lampu iededz no somas, kad satumst."},"n_bone1":{"s":"nar","t":"Zemē kaut kas balts... Duksa kauls! Viņš to te sen aprakis."},"n_cat1":{"s":"nar","t":"Minka ieņaudas, paberzējas gar kāju un aizlavās uz klēti."},"n_board1":{"s":"nar","t":"Minka ar ķepu skrāpē vaļīgu dēli klēts sienā."},"n_board2":{"s":"nar","t":"Aiz dēļa — veca, putekļaina piezīmju grāmatiņa un saplēsts kartes gabals!"},"n_note1":{"s":"nar","t":"“Rakstu 1944. gada rudenī. Ģimenes lādi noslēpu vecajās ejās zem Jāņu kalna.”","v":"Rakstu tūkstoš deviņsimt četrdesmit ceturtā gada rudenī. Ģimenes lādi noslēpu vecajās ejās zem Jāņu kalna."},"n_note2":{"s":"nar","t":"“Pagraba durvis aizslēdzu ar trim zīmēm. Tās zina sētas sargi: ūdens, uguns un koks.”"},"n_note3":{"s":"nar","t":"“Katra sarga zīmi iegriezu tur, kur tas dzīvo: ūdens sargu — akā, uguns sargu — pirtī, koka sargu — vecajā ozolā.”"},"n_note4":{"s":"nar","t":"“Pirmais sargs — ārējā lokā, otrais — vidū, trešais — iekšā.”"},"n_mark_w":{"s":"nar","t":"Akas svirā iegriezta sena zīme."},"n_mark_s":{"s":"nar","t":"Pirts durvju aplodā iegriezta sena zīme."},"n_mark_o":{"s":"nar","t":"Ozola mizā, sūnām apaugusi, redzama sena zīme."},"n_door1":{"s":"nar","t":"Kalnā iebūvētas pagraba durvis. Dzelzs plāksnē — trīs griežami loki ar senām zīmēm."},"n_door2":{"s":"nar","t":"Plāksnē iekalts: “Trīs sargi sargā šīs durvis.”"},"n_door_open":{"s":"nar","t":"Klikšķis... un smagās durvis atveras. Lejā ved tumšas kāpnes."},"n_tun1":{"s":"nar","t":"Pazemes ejas. Gaiss smaržo pēc mitras zemes."},"n_tun2":{"s":"nar","t":"Senās ejas daudzviet sagruvušas. Tālāk būs jārok ar lāpstu."},"n_chest1":{"s":"nar","t":"Lāde ir smaga un kalta ar dzelzi. Iekšā — vecas fotogrāfijas, vēstule un dokumenti.","v":"Lāde ir smaga, kalta ar dzelzi. Iekšā ir vecas fotogrāfijas, vēstule un dokumenti."},"n_chest2":{"s":"nar","t":"Un vēl — zelta gredzens, ietīts lakatiņā."},"n_cave1":{"s":"nar","t":"Zemūdens ala! Augšā — gaisa kabata. Te var elpot."},"n_cave2":{"s":"nar","t":"Tumsā mirdz sēnes un aļģes. Šeit dzīvo sava, slēpta pasaule."},"n_box1":{"s":"nar","t":"Uz smiltīm — veca skārda kārba. Iekšā, vaska drānā ietīts, kartes gabals!"},"n_pearl":{"s":"nar","t":"Milzīga gliemene... un tajā — ezera pērle!"},"n_tower1":{"s":"nar","t":"No torņa var redzēt tālu — pāri pļavām līdz pat purvam."},"n_fire1":{"s":"nar","t":"Mežā kūp dūmi! Kāds atstājis neizdzēstu ugunskuru."},"n_fire_out":{"s":"nar","t":"Šņāciens, tvaiks... Uguns nodzisusi. Mežs ir glābts."},"n_water":{"s":"nar","t":"Rīkste pēkšņi noliecas pie zemes. Šeit zem kājām ir ūdens!"},"n_well2":{"s":"nar","t":"Jaunā aka ir gatava. Ūdens ir tīrs un ledusauksts."},"n_map":{"s":"nar","t":"Visi trīs kartes gabali saliekas kopā! Tagad redzams, kur zem Jāņu kalna paslēpta lāde."},"n_swim":{"s":"nar","t":"Ūdens ir vēss un dzidrs. Zem ūdens elpu var aizturēt tikai īsu brīdi."},"n_fern1":{"s":"nar","t":"Paparde atvērās tavā priekšā kā mazs, mirdzošs ugunskurs."},"n_fern2":{"s":"nar","t":"Mežs uz mirkli apklusa. Un tad tu sadzirdēji — putni runāja. Vārdos."},"n_fern3":{"s":"nar","t":"Leģenda izrādījās patiesa."},"g_intro1":{"s":"gran","t":"Lienīt! Nāc šurp, lai tieku klāt. Paga, soma tev vēl uz pleca."},"g_intro2":{"s":"gran","t":"Pēc nedēļas — Jāņi. Vecie ļaudis saka, ka Jāņu naktī vecajā mežā aiz purva uzzied papardes zieds."},"g_intro3":{"s":"gran","t":"Kas to atrod, tam visu mūžu laime. Tavs vectēvs to meklē katru vasaru."},"g_intro4":{"s":"gran","t":"Vectētiņš pa dienu būs mežsarga mājiņā. Ja no rīta sadzirdēsi spaini pie sliekšņa, viņš aizgājis uz ezeru."},"g_intro5":{"s":"gran","t":"Tev te rupjmaize. Un rublītis, lai vari pati izlemt, ko ņemt autoveikalā. Sērkociņi lai pagaidām paliek somā."},"g_intro6":{"s":"gran","t":"Pa ceļam ieej mājā, noliec somu. Tavs krūzītes rokturis aizvien uz kreiso pusi. Tad, ja gribi, paskaties šķūnī pēc darbarīkiem."},"g_milk":{"s":"gran","t":"Te tev svaigs piens no Raibaļas."},"g_jani":{"s":"gran","t":"Līgo diena! Te tev Jāņu siers ar ķimenēm."},"g_mouse":{"s":"gran","t":"Minka šonakt noķēra peli klētī. Te tev rupjmaize — par palīdzību!"},"g_shed":{"s":"gran","t":"Šķūnī ir vectēva vecie darbarīki. Paskaties — gan jau kaut kas noderēs!"},"g_axe":{"s":"gran","t":"Vectēva cirvis! Uzsit tam kātu — divi stipri zari, un aiziet malkā."},"g_logs":{"s":"gran","t":"Malka vienmēr vajadzīga. Mežs ir aiz lielceļa. Cērt, cik vajag — mežs ataugs."},"g_attic1":{"s":"gran","t":"Vakarā satumst. Bēniņos ir vectēva petrolejas lampa — kāpnes ir mājas galā."},"g_attic2":{"s":"gran","t":"Naktī bez gaismas mežā neej. Tumsā nevar redzēt, kas tev blakus."},"g_fire1":{"s":"gran","t":"Prasmīgs cilvēks ugunskuru iekur jebkur. Tikai sērkociņus netērē velti!"},"g_fire2":{"s":"gran","t":"Uguns sasilda un atbaida meža zvērus. Mežacūkas no uguns baidās."},"g_gpa":{"s":"gran","t":"Vectēvs gaida tevi mežsarga mājiņā — aiz lielceļa, meža malā pie purva. Rītos viņš makšķerē ezerā."},"g_offer1":{"s":"gran","t":"Mežā dzīvo ziņkārīši. Viņi nav ļauni — tikai ziņkārīgi un mīl visu, kas spīd un garšo."},"g_offer2":{"s":"gran","t":"Atstāj viņiem pienu uz upurakmens meža malā. Tad viņi tev palīdzēs."},"g_bridge1":{"s":"gran","t":"Pār purvu bez laipas netiksi — dūksts kā aka. Vajag dēļus un naglas."},"g_bridge2":{"s":"gran","t":"Aiz purva ir vecais mežs. Tur aug paparde, kas Jāņu naktī zied..."},"g_wreath":{"s":"gran","t":"Jāņu vainags pasargā no ļauniem gariem. Pļavā salasi Jāņu zāles, bet no lielā ozola — zarus."},"g_bonfire":{"s":"gran","t":"Uz Jāņu kalna sakrauj ugunskuru — četri baļķi, zari un sveķi, lai labi deg."},"g_ligo":{"s":"gran","t":"Līgo vakarā iededzināsim uguni kalnā. Uguns jāuztur visu nakti — tad būs laba vasara!"},"g_fern1":{"s":"gran","t":"Ej nu, ej! Paņem gaismu. Papardes zieds parādās tikai tam, kas meklē ar tīru sirdi."},"g_fern2":{"s":"gran","t":"Ziņkārīši zina, kur tas zied. Ja viņi tev ir draugi — seko tiem."},"g_done1":{"s":"gran","t":"Tu tiešām atradi papardes ziedu? Tavs vectēvs būs tik lepns..."},"g_done2":{"s":"gran","t":"Vasara vēl gara. Ej, staigā, meklē — mežs ir pilns brīnumu."},"g_dog1":{"s":"gran","t":"Duksis staigā noskumis. Viņš kaut kur aprakis savu kaulu un nevar to atrast."},"g_dog2":{"s":"gran","t":"Paskaties pie šķūņa — tur zeme vienmēr izrakņāta. Ar lāpstu atradīsi."},"g_cat1":{"s":"gran","t":"Mūsu Minka kļuvusi tāda kašķīga... Laikam gribas svaigu zivi."},"g_cat2":{"s":"gran","t":"Ja noķersi zivi, iedod viņai. Kaķi zina daudz noslēpumu!"},"g_cat_done":{"s":"gran","t":"Minka atkal murrā! Un no klēts peles bēg prom."},"g_sauna1":{"s":"gran","t":"Pirtiņa sen nav kurināta... Ja salabosi — Jāņos iesim pērties!"},"g_sauna2":{"s":"gran","t":"Dēļus taisa klētī no baļķiem, mālu rok ezera krastā."},"g_ring":{"s":"gran","t":"Vectētiņš man atnesa savas mammas gredzenu. Es biju piemirsusi, cik tas ir viegls. Paldies, Lienīt."},"g_tip0":{"s":"gran","t":"Un atceries: ja bezdelīgas lido zemu — būs lietus."},"g_tip1":{"s":"gran","t":"Un atceries: kad vardes skaļi kurkst, gaidi lietu."},"g_tip2":{"s":"gran","t":"Un atceries: pēc lietus mežā aug sēnes — gailenes mīl mitrumu."},"g_tip3":{"s":"gran","t":"Un atceries: negaisā neslēpies zem koka — Pērkons sper augstākajā kokā."},"g_tip4":{"s":"gran","t":"Un atceries: ar lāpas dūmiem bites paliek mierīgas."},"g_tip5":{"s":"gran","t":"Un atceries: miglā un naktī purvā redz maldugunis — tur, saka, nauda aprakta."},"g_tip6":{"s":"gran","t":"Un atceries: vējš nolauž zarus — pēc vēja mežā viegli salasīt malku."},"g_tip7":{"s":"gran","t":"Un atceries: jāņtārpiņi spīd siltās naktīs. Burkā tie būs lukturis, ko lietus neizdzēš."},"g_tip8":{"s":"gran","t":"Un atceries: lietū paslēpies zem pieturas jumta vai būdā."},"g_tip9":{"s":"gran","t":"Saulē un vējā sēnes izkalst ātri. Ja ir zari un aukla, vari pati uztaisīt žāvētavu."},"g_tip10":{"s":"gran","t":"Un atceries: mežacūkas dienā guļ biezoknī. Neej tām par tuvu!"},"g_tip11":{"s":"gran","t":"Un atceries: ziņkārīši baidās no uguns un no Duksa."},"gp_meet1":{"s":"gpa","t":"Nu re, Liene! Sēdies. Man tavā pusē vēl sauss dēļa gals."},"gp_meet2":{"s":"gpa","t":"Es šo mežu sargāju jau četrdesmit gadus. Katru Jāņu nakti meklēju papardes ziedu... un vēl kaut ko."},"gp_meet3":{"s":"gpa","t":"Kara laikā mans tēvs paslēpa mūsu ģimenes lādi pazemes ejās zem Jāņu kalna."},"gp_meet4":{"s":"gpa","t":"Karti viņš saplēsa trīs gabalos, lai svešs to neatrastu. Viens gabals ir pie manis — ņem."},"gp_meet5":{"s":"gpa","t":"Otrs palika ezera alā. Pats tur vairs nenonirstu. Ja meklēsi, paskaties, kur ceļš atpakaļ. Uz laipas es būšu tepat."},"gp_meet6":{"s":"gpa","t":"Trešais pazuda kopā ar viņa piezīmju grāmatiņu. Varbūt kaut kur sētā..."},"gp_meet7":{"s":"gpa","t":"Un vēl man vajag palīga. Uzbūvē meža malā novērošanas torni — no augšas var redzēt, ja kaut kur deg."},"gp_hi":{"s":"gpa","t":"Kas tev prātā, Lienīt?"},"gp_cave":{"s":"gpa","t":"Ezera dziļumā, pie kreisā krasta, ir ala. Ieniršana ir tumša — ievelc elpu un peldi droši."},"gp_piece3":{"s":"gpa","t":"Trešais gabals... Tēvs visu rakstīja grāmatiņā. Varbūt kaķis zina — tie visur ložņā."},"gp_signs":{"s":"gpa","t":"Durvis kalnā atveras ar trim zīmēm. Tēvs mīlēja mīklas. Meklē zīmes sētā!"},"gp_dig":{"s":"gpa","t":"Pazemē ņem gaismu un lāpstu. Karte rādīs, kur rakt."},"gp_ret_all1":{"s":"gpa","t":"Tu atnesi visu... Tēva vēstule. Un mātes gredzens!"},"gp_ret_all2":{"s":"gpa","t":"Es to aiznesīšu vecmāmiņai. Paldies, Lienīt. No visas sirds."},"gp_ret_ring1":{"s":"gpa","t":"Tu atnesi lādi... Bet tur vajadzēja būt arī mātes gredzenam."},"gp_ret_ring2":{"s":"gpa","t":"Nu, laikam pazudis. Vienalga — paldies tev."},"gp_ring_back":{"s":"gpa","t":"Mammas gredzens. Tu tomēr to atradi. Paldies, Lienīt. Aiznesīšu vecmāmiņai."},"gp_knife":{"s":"gpa","t":"Ņem manu kabatas nazi. Ar to rakt un cirst būs vieglāk."},"gp_tow1":{"s":"gpa","t":"Torni uzbūvē, kur gribi, — tikai tuvu mežam. Vajag baļķus, dēļus, naglas un auklu."},"gp_tow2":{"s":"gpa","t":"Uzkāp tornī un paskaties apkārt. Ja redzi dūmus — tūlīt dzēs!"},"gp_tow_fire":{"s":"gpa","t":"Dūmi? Ņem ūdeni no akas — divus spaiņus — un ātri uz turieni!"},"gp_tow_done":{"s":"gpa","t":"Tu pamanīji dūmus un paguvi palīdzēt. Malacīte, Lienīt."},"gp_well1":{"s":"gpa","t":"Manas mājiņas aka ir izsīkusi. Vajag jaunu."},"gp_well2":{"s":"gpa","t":"Ņem šo lazdas rīksti. Staigā lēnām — kur rīkste noliecas, tur zem zemes ir ūdens."},"gp_well3":{"s":"gpa","t":"Kad atradīsi vietu, rok aku. Vajag akmeņus, dēļus un auklu."},"gp_well_done":{"s":"gpa","t":"Tīrs ūdens! Tagad man nebūs jāstaigā līdz ezeram. Paldies!"},"gp_fern1":{"s":"gpa","t":"Papardes zieds zied tikai Jāņu naktī, īsu brīdi. Tas spīd kā ogle."},"gp_fern2":{"s":"gpa","t":"Es to redzēju vienreiz — puikas gados. Bet, kamēr pieskrēju, tas jau bija nodzisis."},"gp_zk1":{"s":"gpa","t":"Ziņkārīši? He-he. Mazi meža gariņi. Tie neko ļaunu nedara — tikai pievāc, kas spīd."},"gp_zk2":{"s":"gpa","t":"Ja viņus pacienā, tie kļūst par draugiem un parāda apslēptas lietas."},"gp_bye":{"s":"gpa","t":"Ej nu, ej. Un sveicini vecmāmiņu!"},"gp_fish":{"s":"gpa","t":"Šš... zivis aizbaidīsi. Labākais loms ir rītausmā."},"gp_jani":{"s":"gpa","t":"Līgo! Šonakt ej uz veco mežu. Varbūt šis ir tavs gads."},"gp_nothing":{"s":"gpa","t":"Pagaidām viss kārtībā. Ej, palīdzi vecmāmiņai."} const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = s => mulberry32(Math.floor(s * 2654435761) >>> 0);
function hash(i, s) { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); }
function noise1(x, s) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i, s), hash(i + 1, s), u); }
function fbm(x, s, o) { let v = 0, a = .5, t = 0, f = 1; for (let i = 0; i < o; i++) { v += a * noise1(x * f, s + i * 13.7); t += a; a *= .5; f *= 2.07; } return v / t; }
const rgba = (c, a = 1) => 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const jit = (c, j, r) => [c[0] + (r() - .5) * 2 * j, c[1] + (r() - .5) * 2 * j, c[2] + (r() - .5) * 2 * j];

const WW = 8400, WATER_Y = -30, PIER_Y = -12, PIER_X0 = 930, BOG_A = 6450, BOG_B = 7120, BRIDGE_Y = -8;

function biome(x) { for (const b of BIOMES) if (x < b[1]) return b[0]; return 'old'; }

function rawH0(x) {
  let h = (fbm(x / 560, 3, 3) - .5) * 64 + (fbm(x / 170, 7, 2) - .5) * 16;
  h += sstep(4700, 5000, x) * (1 - sstep(6200, 6400, x)) * (fbm(x / 300, 11, 2) - .5) * 34;
  const fl = sstep(2900, 3010, x) * (1 - sstep(4660, 4760, x));
  h = lerp(h, 4 + (fbm(x / 400, 5, 2) - .5) * 8, fl * .9);
  h += 82 * Math.exp(-Math.pow((x - 2770) / 112, 2));
  const bg = sstep(6330, 6460, x) * (1 - sstep(7100, 7230, x));
  h = lerp(h, -20 + (fbm(x / 45, 9, 2) - .5) * 7, bg);
  h += sstep(7150, 7420, x) * 16;
  const lk = sstep(1450, 1160, x);
  const bed = -76 - 92 * sstep(1190, 980, x) + (fbm(x / 90, 4, 2) - .5) * 12 + 34 * sstep(150, 0, x) - 24 * Math.exp(-Math.pow((x - 262) / 30, 2));
  h = lerp(h, bed, lk);
  h += sstep(8170, 8400, x) * 95;
  return h;
}
// pagraba durvīm Jāņu kalna sānā — neliela terase
const TERR_X = 2842, TERR_H = rawH0(TERR_X);
function rawH(x) { return lerp(rawH0(x), TERR_H, Math.exp(-Math.pow((x - TERR_X) / 30, 2)) * .92); }
const HOFF = 400, HT = new Float32Array(Math.ceil((WW + 2 * HOFF) / 2) + 2);
for (let i = 0; i < HT.length; i++) HT[i] = rawH(i * 2 - HOFF);
function gh(x) { const f = (x + HOFF) / 2; let i = Math.floor(f); const t = f - i; i = clamp(i, 0, HT.length - 2); return HT[i] + (HT[i + 1] - HT[i]) * t; }
let SHORE_X = 1300, PIER_LAND = 1340;
for (let x = 1100; x < 1700; x++) { if (gh(x) >= WATER_Y) { SHORE_X = x; break; } }
for (let x = 1100; x < 1700; x++) { if (gh(x) >= PIER_Y) { PIER_LAND = x; break; } }
function surf(x) {
  if (x < PIER_LAND) return Math.max(PIER_Y, gh(x));

  return gh(x);
}

}

    c.globalAlpha = 1; c.fillStyle = rgba(col); c.beginPath(); c.moveTo(ta - 20, 240);

    const st = 5;
    for (let x = Math.floor((ta - 30) / st) * st; x <= tb + 30; x += st) {
      const h1 = hash(x, seed), h2 = hash(x + 3, seed), xx = x + h2 * st, y = -ridgeY(xx, base, amp, sc, seed), th = 6 + h1 * 13, tw = 2.4 + h2 * 2.6;

function layerWeights(wx) {

  P.x = clamp(S.px || 3060, PIER_X0 + 20, WW - 90); P.face = S.face || 1; P.y = surf(P.x); if (S.F.dog && S.F.dogFollow) DOG.x = P.x - 40;
  enterPlay();
  if (S.farm.shopAway) openFarm('shopVillage');
  const d = dateOf(dayIdx()); toast('Laipni atpakaļ! ' + d.day + '. ' + MON_NAME[d.m] + ', ' + fmtClock(clockMin()) + '.');
}
function attractState() { S = newState(); S.gm = 13 * 60; S.wx = { q: [{ w: 'clear', s: 0, e: 99999 }], cloud: .25, rain: 0, wind: .2, fog: 0, storm: 0 }; genWorld(); initCreatures(); P.x = 3060; P.y = surf(P.x); }
function showStart(save) {
  const sc = $('screen'); sc.className = 'start';
  const d = save ? dateOf(Math.floor((START_MIN + save.gm) / 1440)) : null;
  sc.innerHTML = '<p class="year">\'89 6 16</p><h1 class="title">Papardes zieds</h1><p class="sub">Vasara pie vecmāmiņas</p>' +
    '<p class="howto">Liene ir atbraukusi pie vecmāmiņas uz vasaru. Sētā gaida silta virtuve, ezerā vectētiņš, bet aiz purva sākas ceļš uz papardes ziedu. Līdz Jāņiem ir nedēļa.</p>' +
    '<div class="btns">' + (save ? '<button class="go" id="bCont" type="button">Turpināt · ' + d.day + '. ' + MON_NAME[d.m] + '</button><button class="go alt" id="bNew" type="button">Sākt no jauna</button>' : '<button class="go" id="bNew" type="button">Sākt vasaru</button>') + '</div>' +
    '<p class="rot">Ērtāk spēlēt, telefonu turot guļus. Ieslēdz skaņu!</p>';
  sc.classList.remove('gone');
  if (save) $('bCont').onclick = () => { audioInit(); audioResume(); continueGame(save); };
  $('bNew').onclick = () => {
    audioInit(); audioResume();
    if (save && !sc.dataset.sure) { sc.dataset.sure = 1; $('bNew').textContent = 'Tiešām no jauna? Spied vēlreiz'; return; }
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { } newGame();
  };
}

/* ---------------- galvenais cikls ---------------- */
let lastTs = 0, perfT = 0, perfN = 0, perfA = 0;
function frame(ts) {
  const raw = lastTs ? (ts - lastTs) / 1000 : .016; lastTs = ts;
  const dt = clamp(raw, 0, .05);
  try {
    if (S && LAYERS.length && GROUND && GROUND.tiles.length) {
      const running = S.started && !PAUSED && !DLG && !PANEL && !FADE && !PZ.open;
      if (running) update(dt); else TT.t += dt;
      if (Math.abs(ZOOM - ZOOMT) > .002) { ZOOM += (ZOOMT - ZOOM) * Math.min(1, dt * 2.6); if (Math.abs(ZOOM - ZOOMT) < .004) ZOOM = ZOOMT; applyZoom(); }
      if (!S.started) { cam.x = 3150 + Math.sin(TT.t * .045) * 1350; cam.y += (gh(cam.x) * .5 - cam.y) * Math.min(1, dt * 2); }
      else { if (TW.on) towerCam(dt); else if (!SCN) updateCam(dt); if (!PAUSED) findAction(); }
      if (SCN) renderScene(dt); else render(dt);
      if (S.started && !PAUSED) { hudT -= dt; if (hudT <= 0 || uiDirty) { hudT = .25; uiDirty = false; updateHUD(); } else updateActBtn(); }
      if (running) { perfT += raw; perfN++; perfA += raw; if (perfT > 3) { if (perfA / perfN > .031 && QUAL > 1) { QUAL = Math.max(1, QUAL - .5); resize(); } perfT = perfN = perfA = 0; } }
    }
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
let HOTSAVE = null;
function boot() {
  cv = $('cv'); ctx = cv.getContext('2d'); skyCv = mk(2, 2); skyCtx = skyCv.getContext('2d'); darkCv = mk(2, 2); darkCtx = darkCv.getContext('2d');
  try { const st = JSON.parse(localStorage.getItem('pz_settings') || '{}'); if (st.q) QUAL = st.q; if (st.snd === 0) AU.on = false; if (st.vo === 0) VO.on = false; FARM_MEMORY = !!st.memories; FARM_LARGE_TEXT = !!st.largeText; document.body.classList.toggle('farm-large', FARM_LARGE_TEXT); } catch (e) { }
  buildSkyBits(); resize(); window.addEventListener('resize', resize);
  bindInput();
  const jobs = [makeIcons, () => setIcons(), buildSprites, buildExtraSprites, makeSignImgs, buildTileTex, ...layerJobs()];
  let i = 0; const bar = $('loadbar');
  const step = () => {
    const t0 = performance.now();
    while (i < jobs.length && performance.now() - t0 < 40) { try { jobs[i](); } catch (e) { console.error(e); } i++; }
    bar.style.width = Math.round(i / jobs.length * 100) + '%';
    if (i < jobs.length) { setTimeout(step, 0); return; }
    BUILD_IC = { campfire: ICON.ui_warm, hut: thumb(SPR.hut), rack: thumb(SPR.rack), tower: thumb(SPR.tower), aka: thumb(SPR.aka) };
    setIcons();
    const save = HOTSAVE || loadSave();
    attractState(); updateCam(0, true);
    showStart(save && (save.v === 1 || save.v === 2) ? save : null);
  };
  requestAnimationFrame(frame); setTimeout(step, 30);
}
function start(data) { HOTSAVE = data && data.save ? data.save : null; boot(); }
(function () {
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) try { hot.snapshot(() => ({ save: S && S.started ? JSON.parse(JSON.stringify(serialize())) : null })); } catch (e) { }
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
