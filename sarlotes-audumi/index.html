<style>
:root{--bg:#f7f0e6;--ink:#2b2420;--muted:#6b5e55;--accent:#c2410c;--teal:#0f766e;--card:#fffdf9;--line:#e6d8c6;--green:#dcf8c6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2b2420;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1500px;margin:0 auto;background:var(--bg);overflow:hidden}
#top{display:flex;align-items:center;gap:10px;padding:6px 10px;background:#3b2f2a;color:#fff;min-height:48px;flex:none}
#top .pill{background:rgba(255,255,255,.12);border-radius:999px;padding:5px 12px;font-size:20px;font-weight:800;white-space:nowrap}
#top .grow{flex:1;font-size:15px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:12px;font-size:22px;min-width:46px;height:42px;cursor:pointer}
#main{flex:1;display:flex;flex-direction:column;min-height:0}
#stage{position:relative;flex:none;margin:0 auto;background:#1d1714}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#side{flex:1;display:flex;flex-direction:column;min-height:0;padding:8px 10px 10px;gap:8px;overflow:hidden}
body.wide #main{flex-direction:row}
body.wide #stage{margin:0}
body.wide #side{padding:12px 14px}
#say{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px 12px;box-shadow:0 2px 0 rgba(0,0,0,.05);flex:none}
#say.hide,#task.hide,#replies.hide{display:none}
#sayWho{font-weight:800;font-size:16px;margin-bottom:2px}
#sayTxt{font-size:20px;line-height:1.35;font-weight:600}
#sayBtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#task{font-size:19px;line-height:1.3;font-weight:700;background:#fff3e0;border-left:6px solid var(--accent);border-radius:10px;padding:8px 12px;flex:none}
#task small{display:block;font-weight:600;font-size:16px;color:var(--muted);margin-top:2px}
#btns{display:flex;flex-wrap:wrap;gap:8px;flex:none}
.btn{font:inherit;font-size:19px;font-weight:800;min-height:54px;padding:10px 18px;border-radius:14px;border:0;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 3px 0 #7c2d12;flex:1 1 auto}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.teal{background:var(--teal);box-shadow:0 3px 0 #134e4a}
.btn.choice{background:#fff;color:var(--ink);border:2px solid #d6c3ad;box-shadow:0 3px 0 #d6c3ad;text-align:left;flex:1 1 100%;font-weight:700}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
#chat{flex:1;min-height:90px;display:flex;flex-direction:column;background:#efe6d8;border-radius:16px;overflow:hidden;border:2px solid var(--line)}
#chatHead{background:var(--teal);color:#fff;padding:7px 12px;font-weight:800;font-size:16px;display:flex;gap:8px;align-items:center;flex:none;cursor:pointer}
#chatHead span{font-weight:500;opacity:.85;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msgs{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.m{max-width:86%;padding:7px 11px 8px;border-radius:14px;font-size:17px;line-height:1.3;background:#fff;align-self:flex-start;box-shadow:0 1px 0 rgba(0,0,0,.08);animation:pop .25s ease-out}
.m b{display:block;font-size:14px;margin-bottom:1px}
.m.me{align-self:flex-end;background:var(--green)}
.m.sys{align-self:center;background:#fdf6e3;color:var(--muted);font-size:14px;max-width:95%;text-align:center}
.m.typing{color:var(--muted);font-style:italic;font-size:15px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}

.chip{font:inherit;font-size:16px;font-weight:700;padding:8px 12px;border-radius:999px;border:2px solid var(--teal);background:#fff;color:var(--teal);cursor:pointer}
#ov{position:fixed;inset:0;background:rgba(30,20,15,.55);display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}

.shareBox{white-space:pre-wrap;background:#f3ead9;border-radius:12px;padding:10px 12px;font-size:17px;line-height:1.4;margin-top:8px}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#3b2f2a;color:#fff;padding:10px 16px;border-radius:12px;font-size:18px;font-weight:700;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.tempo{display:flex;flex-direction:column;gap:8px;margin-top:10px}

<body>
<div id="app">
  <header id="top">

<script>
const SHARE_URL = "https://edgarskalnins2021-cell.github.io/papardes-zieds/sarlotes-audumi/";
/* ---- 00_core.js ---- */
'use strict';
/* ================= Šarlotes audumi — kodols ================= */
const W = 600, H = 600;
const $ = s => document.querySelector(s);
const cv = $('#cv'); let g = cv.getContext('2d');
let SC = 1, DPR = 1, TIMESCALE = 1;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const dist = (a, b, c, d) => Math.hypot(a - c, b - d);
const inR = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
const R = (x, y, w, h) => ({ x, y, w, h });
const eur = v => (Math.round(v * 100) / 100).toFixed(2).replace('.', ',') + ' €';
const m2 = v => (Math.round(v * 100) / 100).toString().replace('.', ',') + ' m';

/* ---------- nejaušība (dienas izaicinājums: viena diena visām) ---------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function seedFor(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
let rnd = mulberry32(1);
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fr = Math.random; // efektiem (neietekmē dienas sēklu)

/* ---------- saglabāšana ---------- */
const SAVE_KEY = 'sarlotes_audumi_v1';
function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; } }
const S = Object.assign({ name: '', tempo: 'parasti', coins: 0, up: {}, days: 0, sound: true, voice: true, hist: [], best: 0, day: null, reached: {} }, loadSave());
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { } }
const TEMPO = { mierigi: { k: 1.45, name: 'Mierīgi', hint: 15 }, parasti: { k: 1, name: 'Parasti', hint: 20 }, sestdiena: { k: .78, name: 'Sestdiena', hint: 26 } };
const TK = () => (TEMPO[S.tempo] || TEMPO.parasti).k;

/* ---------- dienas stāvoklis ---------- */
let D = null;
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function newDay(mode) {
  D = {
    mode, date: today(), n: S.days + 1, min: 8 * 60 + 40, coins: 0, scene: null, drink: null,
    coffee: 100, openAt: null, ordersDone: 0, ordersLate: 0, ordersTotal: 0, cust: 0, custHappy: 0, custAngry: 0,
    hearts: [], quizOk: 0, quizN: 0, cuts: [], dust: 0, cleanSum: 0, cleanN: 0, cash: 0, card: 0, float: 137,
    cashOk: null, morningOk: 0, chocoUsed: false, sc: {}
  };
  S.day = D; save();
}
function fmtMin(m) { m = Math.round(m); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function setMin(m) { if (!D) return; D.min = m; $('#clock').textContent = '⏰ ' + fmtMin(m); }
function addMin(dm) { if (D) setMin(D.min + dm); }

/* ---------- teksti un balsis ---------- */
let LINES = {};
const SPK = {
  ieva: ['Ieva (vadītāja)', '#b45309'], dace: ['Dace', '#0f766e'], zane: ['Zane', '#7c3aed'], me: ['Tu', '#2563eb'],
  nar: ['', '#6b5e55'], sys: ['', '#6b5e55'], barista: ['Bārists Toms', '#92400e'], kl: ['Kliente', '#be185d'],
  klv: ['Klients', '#1d4ed8'], kurjers: ['Kurjers', '#ea580c'], apsargs: ['Apsardze', '#475569']
};
function T(id) { const l = LINES[id]; if (!l) { console.error('Trūkst teksta: ' + id); return id; } return l[1].replace(/\{name\}/g, S.name || 'kolēģe'); }
function WHO(id) { return LINES[id] ? LINES[id][0] : 'nar'; }
let VO = null;
function voice(id) {
  if (VO) { try { VO.pause(); } catch (e) { } VO = null; }
  if (!S.voice || !window.SA_VOICES || !SA_VOICES.includes(id)) return;
  try { VO = new Audio('voice/' + id + '.mp3'); VO.play().catch(() => { }); } catch (e) { }
}

/* ---------- ainas ---------- */
const SCENES = {}; let SC_ID = null, SCN = null;
const ORDER = ['call', 'morning', 'bike', 'cafe', 'run', 'keys', 'alarm', 'shutter', 'dark', 'prep', 'orders', 'locker', 'open', 'close'];
const SC_NAME = { call: 'Rīta zvans', morning: 'Rīta steiga', bike: 'Ar riteni', cafe: 'Kafejnīca', run: 'Skrējiens', keys: 'Atslēgas', alarm: 'Signalizācija', shutter: 'Rullo vārti', dark: 'Tumšais veikals', prep: 'Pirms atvēršanas', orders: 'Interneta pasūtījumi', locker: 'Pakomāts', open: 'Veikals atvērts', close: 'Slēgšana' };
function scene(id, def) { def.id = id; SCENES[id] = def; }
const fade = { a: 0, dir: 0, next: null };
function go(id, arg) { if (fade.dir === 1) return; fade.next = [id, arg]; fade.dir = 1; }
function enterNow(id, arg) {
  if (SCN && SCN.exit) SCN.exit();
  stopLoops(); voice(null); ui.reset(); FX.length = 0;
  SC_ID = id; SCN = SCENES[id];
  if (D && ORDER.includes(id)) { D.scene = id; S.day = D; S.reached[id] = 1; save(); }
  rnd = mulberry32(seedFor((D ? D.date : 'x') + '/' + id));
  idle = 0; hintIx = 0; SCN.t = 0;
  $('#topTitle').textContent = SC_NAME[id] ? (ORDER.indexOf(id) + 1) + '/14 · ' + SC_NAME[id] : 'Šarlotes audumi';
  SCN.enter && SCN.enter(arg);
}

/* ---------- padomi čatā, ja iestrēgst ---------- */
let idle = 0, hintIx = 0;
function progress() { idle = 0; }
function hintTick(dt) {
  if (!SCN || !SCN.hints || ui.busy() || fade.dir) return;
  idle += dt;
  const lim = (TEMPO[S.tempo] || TEMPO.parasti).hint;
  if (idle > lim && hintIx < SCN.hints.length) { chat(SCN.hints[hintIx++]); idle = 0; }
}

/* ---------- efekti ---------- */
const FX = [];
function burst(x, y, col, n = 12, sp = 160) { for (let i = 0; i < n; i++) { const a = fr() * 6.283, s = sp * (.4 + fr() * .8); FX.push({ k: 'p', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, l: .8, c: Array.isArray(col) ? col[i % col.length] : col, r: 3 + fr() * 3 }); } }
function floater(x, y, s, col = '#c2410c') { FX.push({ k: 'f', x, y, s, l: 1.3, c: col }); }
function updFx(dt) {
  for (let i = FX.length - 1; i >= 0; i--) {
    const f = FX[i]; f.l -= dt;
    if (f.k === 'p') { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 420 * dt; } else f.y -= 40 * dt;
    if (f.l <= 0) FX.splice(i, 1);
  }
}
function drawFx() {
  for (const f of FX) {
    g.globalAlpha = clamp(f.l * 1.5, 0, 1);
    if (f.k === 'p') { g.fillStyle = f.c; g.beginPath(); g.arc(f.x, f.y, f.r, 0, 7); g.fill(); }
    else { txtO(f.s, f.x, f.y, 26, f.c, '#fff'); }
  }
  g.globalAlpha = 1;
}

/* ---------- kamoliņi ---------- */
function award(n, x = W / 2, y = H / 2) {
  n = Math.round(n); if (n <= 0) return;
  S.coins += n; if (D) { D.coins += n; D.sc[SC_ID] = (D.sc[SC_ID] || 0) + n; }
  floater(x, y, '+' + n + ' 🧶'); sfx('coin'); ui.coins(); save();
}

/* ---------- ievade ---------- */
let PD = false;
function lp(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
cv.addEventListener('pointerdown', e => {
  audioUnlock(); if (fade.dir || ui.ovOpen) return;
  if (ui.sayOpen && ui.sayCanTap) { ui.sayNext(); return; }
  try { cv.setPointerCapture(e.pointerId); } catch (er) { }
  PD = true; const [x, y] = lp(e); SCN && SCN.down && SCN.down(x, y);
});
cv.addEventListener('pointermove', e => { const [x, y] = lp(e); if (SCN && SCN.move) SCN.move(x, y, PD); if (SCN && SCN.hot) cv.style.cursor = SCN.hot(x, y) ? 'pointer' : 'default'; });
cv.addEventListener('pointerup', e => { if (!PD) return; PD = false; const [x, y] = lp(e); SCN && SCN.up && SCN.up(x, y); });
cv.addEventListener('pointercancel', () => { if (!PD) return; PD = false; SCN && SCN.up && SCN.up(-99, -99); });
addEventListener('keydown', e => {
  audioUnlock(); if (ui.ovOpen) return;
  if (ui.sayOpen && ui.sayCanTap && (e.key === 'Enter' || e.key === ' ')) { ui.sayNext(); e.preventDefault(); return; }
  if (SCN && SCN.key && SCN.key(e.key, true) === true) e.preventDefault();
});
addEventListener('keyup', e => { if (SCN && SCN.key) SCN.key(e.key, false); });

/* ---------- izkārtojums ---------- */
function layout() {
  const vw = innerWidth, vh = innerHeight, top = $('#top').offsetHeight || 48;
  const wide = vw > vh * 1.05 && vw >= 640;
  document.body.classList.toggle('wide', wide);
  let s;
  if (wide) s = Math.min(vh - top, vw - Math.max(320, vw * .32));
  else s = Math.min(vw, (vh - top) * .56);
  s = Math.max(200, Math.floor(s));
  const st = $('#stage'); st.style.width = s + 'px'; st.style.height = s + 'px';
  DPR = Math.min(2.5, window.devicePixelRatio || 1); SC = s / W;
  cv.width = Math.round(s * DPR); cv.height = Math.round(s * DPR);
}
addEventListener('resize', layout);

/* ---------- galvenais cikls ---------- */
let last = 0, TT = 0;
function frame(ts) {
  let dt = Math.min(.05, ((ts - last) / 1000) || 0); last = ts; dt *= TIMESCALE; TT += dt;
  try {
    if (SCN && fade.dir !== 1) { SCN.t += dt; SCN.update && SCN.update(dt); }
    updFx(dt); hintTick(dt);
    g.setTransform(DPR * SC, 0, 0, DPR * SC, 0, 0);
    g.clearRect(0, 0, W, H);
    if (SCN && SCN.draw) SCN.draw();
    drawFx();
    if (fade.dir === 1) { fade.a += dt * 3.2; if (fade.a >= 1) { fade.a = 1; const [id, arg] = fade.next; fade.dir = -1; enterNow(id, arg); } }
    else if (fade.dir === -1) { fade.a -= dt * 3.2; if (fade.a <= 0) { fade.a = 0; fade.dir = 0; } }
    if (fade.a > 0) { g.fillStyle = 'rgba(25,18,14,' + fade.a + ')'; g.fillRect(0, 0, W, H); }
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}

/* ---- 01_audio.js ---- */
/* ================= skaņas (radītas pārlūkā, bez failiem) ================= */
let AC = null, MASTER = null, NOISE = null;
function audioUnlock() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); MASTER = AC.createGain(); MASTER.gain.value = .55; MASTER.connect(AC.destination); } catch (e) { AC = null; }
}
function tone(f, d = .12, type = 'sine', v = .25, when = 0, slide = 0) {
  if (!AC || !S.sound) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), gn = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(v, t + .01); gn.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(gn); gn.connect(MASTER); o.start(t); o.stop(t + d + .05);
}
function noiseBuf() {
  if (NOISE) return NOISE;
  const b = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return NOISE = b;
}
function noise(d = .2, v = .2, f = 1000, q = 1, type = 'bandpass', when = 0) {
  if (!AC || !S.sound) return;
  const t = AC.currentTime + when, s = AC.createBufferSource(); s.buffer = noiseBuf();
  const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  const gn = AC.createGain(); gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(.001, t + d);
  s.connect(fl); fl.connect(gn); gn.connect(MASTER); s.start(t, Math.random()); s.stop(t + d + .05);
}
const SFX = {
  tap: () => tone(700, .05, 'triangle', .12),
  ok: () => { tone(660, .1, 'triangle', .22); tone(990, .16, 'triangle', .22, .08); },

/* ---------- cilpas: zvans, sirēna, putekļu sūcējs, liešana, skalošana ---------- */
const LOOPS = {};
const LOOPDEF = {
  ring: () => { const f = () => { for (let i = 0; i < 9; i++) { tone(1320, .05, 'square', .06, i * .1); tone(1660, .05, 'square', .06, i * .1 + .05); } }; f(); const id = setInterval(f, 1900); return { stop: () => clearInterval(id) }; },
  siren: () => {
    const o = AC.createOscillator(), gn = AC.createGain(), lfo = AC.createOscillator(), lg = AC.createGain();
    o.type = 'sawtooth'; o.frequency.value = 760; lfo.frequency.value = 1.6; lg.gain.value = 260;
    lfo.connect(lg); lg.connect(o.frequency); gn.gain.value = .05; o.connect(gn); gn.connect(MASTER); o.start(); lfo.start();
    return { stop: () => { try { o.stop(); lfo.stop(); } catch (e) { } } };
  },
  vac: () => {
    const s = AC.createBufferSource(); s.buffer = noiseBuf(); s.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 850;
    const gn = AC.createGain(); gn.gain.value = .1; const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 175;
    const og = AC.createGain(); og.gain.value = .025; s.connect(f); f.connect(gn); gn.connect(MASTER); o.connect(og); og.connect(MASTER); s.start(); o.start();
    return { stop: () => { try { s.stop(); o.stop(); } catch (e) { } } };
  },
  pour: () => {
    const s = AC.createBufferSource(); s.buffer = noiseBuf(); s.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1300; f.Q.value = .9;
    const gn = AC.createGain(); gn.gain.value = .09; s.connect(f); f.connect(gn); gn.connect(MASTER); s.start();
    return { stop: () => { try { s.stop(); } catch (e) { } } };
  },
  gargle: () => {
    const s = AC.createBufferSource(); s.buffer = noiseBuf(); s.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 520;
    const gn = AC.createGain(); gn.gain.value = .0; const lfo = AC.createOscillator(), lg = AC.createGain();
    lfo.frequency.value = 13; lg.gain.value = .16; lfo.connect(lg); lg.connect(gn.gain);
    s.connect(f); f.connect(gn); gn.connect(MASTER); s.start(); lfo.start();
    return { stop: () => { try { s.stop(); lfo.stop(); } catch (e) { } } };
  },
};
function loop(n, on) {
  if (!on) { if (LOOPS[n]) { LOOPS[n].stop(); delete LOOPS[n]; } return; }
  if (LOOPS[n] || !AC || !S.sound) return;
  try { LOOPS[n] = LOOPDEF[n](); } catch (e) { }
}
function stopLoops() { for (const k in LOOPS) loop(k, false); }

const CHATQ = []; let chatBusy = false;

function chatEl(cls, who, text, col) {
  const e = document.createElement('div'); e.className = 'm ' + cls;
  if (who) { const b = document.createElement('b'); b.textContent = who; b.style.color = col; e.appendChild(b); }
  e.appendChild(document.createTextNode(text)); $('#msgs').appendChild(e);
  while ($('#msgs').children.length > 60) $('#msgs').firstChild.remove();

}
/* chat(teksta ID) vai chat({spk, text}); delay sekundēs */
function chat(x, delay = 0, cb) { CHATQ.push({ x, delay, cb }); if (!chatBusy) chatNext(); }
function chatNext() {
  const it = CHATQ.shift(); if (!it) { chatBusy = false; return; }
  chatBusy = true;
  const spk = typeof it.x === 'string' ? WHO(it.x) : it.x.spk;
  const text = typeof it.x === 'string' ? T(it.x) : it.x.text;
  const sp = SPK[spk] || SPK.nar;
  setTimeout(() => {
    if (spk === 'sys') { chatEl('sys', '', text); sfx('tap'); setTimeout(() => { it.cb && it.cb(); chatNext(); }, 250); return; }
    const ty = chatEl('typing', '', sp[0].split(' ')[0] + ' raksta…');
    const wait = ui.auto ? 10 : Math.min(1700, 500 + text.length * 18);
    setTimeout(() => { ty.remove(); chatEl('', sp[0], text, sp[1]); sfx('chat'); it.cb && it.cb(); chatNext(); }, wait);
  }, ui.auto ? 0 : it.delay * 1000);
}
function chatMe(text) { chatEl('me', '', text); }
function chatClear() { $('#msgs').innerHTML = ''; CHATQ.length = 0; }

/* ================= zīmēšanas palīgi un kopīgā grafika ================= */
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function box(x, y, w, h, c, r = 0) { g.fillStyle = c; if (r) { rr(x, y, w, h, r); g.fill(); } else g.fillRect(x, y, w, h); }
function boxS(x, y, w, h, c, r, sc, lw = 2) { box(x, y, w, h, c, r); g.strokeStyle = sc; g.lineWidth = lw; if (r) { rr(x, y, w, h, r); g.stroke(); } else g.strokeRect(x, y, w, h); }
function circ(x, y, r, c) { g.fillStyle = c; g.beginPath(); g.arc(x, y, Math.max(0, r), 0, 6.2832); g.fill(); }
function ring(x, y, r, c, lw = 2) { g.strokeStyle = c; g.lineWidth = lw; g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.stroke(); }
function ell(x, y, rx, ry, c, rot = 0) { g.fillStyle = c; g.beginPath(); g.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 6.2832); g.fill(); }
function ln(x1, y1, x2, y2, c, w = 2) { g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
function poly(pts, c) { g.fillStyle = c; g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); g.fill(); }
function txt(s, x, y, size = 20, c = '#2b2420', al = 'center', wt = 700, base = 'middle') { g.font = wt + ' ' + size + 'px ' + FONT; g.fillStyle = c; g.textAlign = al; g.textBaseline = base; g.fillText(s, x, y); }
function txtO(s, x, y, size = 22, c = '#fff', oc = '#2b2420', al = 'center', wt = 800) { g.font = wt + ' ' + size + 'px ' + FONT; g.textAlign = al; g.textBaseline = 'middle'; g.lineJoin = 'round'; g.lineWidth = size / 5; g.strokeStyle = oc; g.strokeText(s, x, y); g.fillStyle = c; g.fillText(s, x, y); }
function wrapTxt(s, x, y, maxW, size, lh, c = '#2b2420', al = 'center', wt = 700) {
  g.font = wt + ' ' + size + 'px ' + FONT; const words = String(s).split(' '); const lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  lines.forEach((l, i) => txt(l, x, y + i * lh, size, c, al, wt));
  return lines.length;
}
function lgrad(x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach((s, i) => gr.addColorStop(i / (stops.length - 1), s)); return gr; }
function shadow(x, y, rx, ry, a = .18) { ell(x, y, rx, ry, 'rgba(0,0,0,' + a + ')'); }
function star(x, y, r, c) { g.fillStyle = c; g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * .45 : r; g.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); } g.closePath(); g.fill(); }
function heart(x, y, s, c) { g.fillStyle = c; g.beginPath(); g.moveTo(x, y + s * .35); g.bezierCurveTo(x - s, y - s * .4, x - s * .45, y - s, x, y - s * .45); g.bezierCurveTo(x + s * .45, y - s, x + s, y - s * .4, x, y + s * .35); g.fill(); }
function arrow(x, y, dir, c = '#c2410c', s = 1) { g.save(); g.translate(x, y); g.rotate(dir); g.scale(s, s); poly([-14, -10, 6, -10, 6, -20, 22, 0, 6, 20, 6, 10, -14, 10], c); g.restore(); }
/* kešatmiņa smagajiem fona zīmējumiem */
const CACHE = {};
function cached(key, w, h, fn) {
  if (CACHE[key]) return CACHE[key];
  const c = document.createElement('canvas'); c.width = w * 2; c.height = h * 2;
  const old = g; g = c.getContext('2d'); g.scale(2, 2);

/* ---------- rudens lapas ---------- */
const LEAFC = ['#e67e22', '#d35400', '#f1c40f', '#c0392b', '#b9770e', '#e59866'];
function leaf(x, y, s, rot, c) { g.save(); g.translate(x, y); g.rotate(rot); g.fillStyle = c; g.beginPath(); g.moveTo(0, -s); g.quadraticCurveTo(s * .9, 0, 0, s); g.quadraticCurveTo(-s * .9, 0, 0, -s); g.fill(); g.strokeStyle = 'rgba(0,0,0,.2)'; g.lineWidth = 1; g.beginPath(); g.moveTo(0, -s); g.lineTo(0, s); g.stroke(); g.restore(); }

function leavesUpd(L, dt, wind = 30) { for (const l of L) { l.ph += dt * 2; l.x += (wind + Math.sin(l.ph) * 25) * dt; l.y += (40 + l.s * 3) * dt; l.r += l.vr * dt * 2; if (l.y > H + 10) { l.y = -10; l.x = fr() * W; } if (l.x > W + 10) l.x = -10; if (l.x < -10) l.x = W + 10; } }
function leavesDraw(L) { for (const l of L) leaf(l.x, l.y, l.s, l.r, l.c); }

/* ---------- koki, debesis ---------- */
function tree(x, y, s, k = 0) {

  ln(x, y - 50 * s, x - 22 * s, y - 78 * s, '#5d4037', 5 * s); ln(x, y - 56 * s, x + 20 * s, y - 84 * s, '#5d4037', 5 * s);
  const cs = [LEAFC[k % 6], LEAFC[(k + 2) % 6], LEAFC[(k + 4) % 6]];
  [[0, -110, 42], [-30, -92, 30], [30, -92, 32], [-16, -128, 28], [18, -126, 30], [0, -86, 26]].forEach((b, i) => circ(x + b[0] * s, y + b[1] * s, b[2] * s, cs[i % 3]));
}

/* ---------- spēlētāja (sānskats, skatās pa labi) ---------- */
function drawWoman(x, y, s, pose, ph, o = {}) {

    const kx = Math.sin(a1) * 22, ky = hipY + Math.cos(a1) * 22, fx = kx + Math.sin(a2) * 23, fy = ky + Math.cos(a2) * 23;
    g.strokeStyle = col; g.lineWidth = 9; g.lineCap = 'round'; g.lineJoin = 'round';

  };

      g.save(); g.translate(this.bx, 0); if (this.fly) { g.translate(300, 400); g.rotate(this.fly * 1.4); g.translate(-300, -400); }
      box(96, 236, 408, 330, '#d98880', 16); for (let i = 0; i < 5; i++) for (let j = 0; j < 4; j++) box(110 + i * 80, 250 + j * 78, 64, 62, (i + j) % 2 ? '#f5b7b1' : '#fadbd8', 8);

/* ================= 3. ar riteni caur rudeni ================= */
scene('bike', {
  hints: ['b_hint'],
  enter() {
    setMin(8 * 60 + 51); this.x = 0; this.v = 130; this.goal = 3400; this.good = 0; this.taps = 0; this.cur = 0; this.done = false; this.flat = 0; this.ph = 0; this.L = leavesNew(18);
    ui.task('Mīn pedāļus! Spied, kad punkts ir zaļajā joslā.', 'Pieskaries ekrānam vai pogai «Mīt».');
    ui.btns([{ t: '🚲 Mīt!', id: 'pedal', fn: () => this.tap() }]);
  },
  tap() {
    if (this.done) return; this.taps++;
    if (Math.abs(this.cur) < .2) { this.v = Math.min(440, this.v + 75); this.good++; floater(210, 330, 'Labi!', '#1e8449'); sfx('ok'); progress(); }
    else { this.v = Math.min(440, this.v + 10); floater(210, 330, 'Ups', '#ca6f1e'); sfx('tap'); }
  },
  update(dt) {
    leavesUpd(this.L, dt, -50);
    if (this.done) { this.flat += dt; return; }
    const ph = (this.t * .62) % 1; this.cur = 2 * Math.abs(2 * ph - 1) - 1;
    this.v = Math.max(95, this.v - 42 * dt); this.x += this.v * dt; this.ph += this.v * dt / 22;
    setMin(lerp(531, 545, Math.min(1, this.x / this.goal)));
    if (this.x >= this.goal) this.finish();
  },
  finish() {
    this.done = true; this.x = this.goal; sfx('hiss'); ui.btns([]); ui.task('');
    award(5 + Math.min(15, this.good), 300, 250);
    setTimeout(() => ui.say('b_flat', () => { chat('b_dace', .2); ui.task('Riepa pagalam. Bet kafejnīca ir tepat!'); ui.btns([{ t: '☕ Iet iekšā', id: 'goBtn', fn: () => go('cafe') }]); }), 900);

function makeVac(amount = 1) {
  const n = 12, cell = W / n, grid = [];

    total() { return grid.reduce((a, q) => a + q.d0, 0) || 1; },
    pct() { return 1 - grid.reduce((a, q) => a + q.d, 0) / this.total(); },
    update(dt) { this.t += dt; },
    down(x, y) { this.on = true; this.x = x; this.y = y; loop('vac', true); },
    move(x, y, d) {
      if (!d || !this.on || this.done) return;

      for (const q of grid) { if (q.d <= 0) continue; const cx = q.c * cell + cell / 2, cy = q.r * cell + cell / 2; if (dist(cx, cy, x, y) < 52) { q.d = Math.max(0, q.d - (.05 + md * .012)); if (q.d === 0) { this.dingN++; if (this.dingN % 5 === 0) sfx('ding'); progress(); } } }

    },
    up() { this.on = false; loop('vac', false); },
    draw() {
      tiles(0, 0, W, H, 50);
      for (const q of grid) {
        if (q.d <= .01) continue; g.globalAlpha = q.d; const x = q.c * cell, y = q.r * cell;
        for (let i = 0; i < 3; i++) {
          const px = x + ((q.fx + i * .37) % 1) * cell, py = y + ((q.fy + i * .53) % 1) * cell;
          if ((q.k + i) % 3 === 0) { g.strokeStyle = ['#c0392b', '#1a9aa0', '#c9961a', '#8e44ad'][(q.k + i) % 4]; g.lineWidth = 2; g.beginPath(); g.moveTo(px, py); g.quadraticCurveTo(px + 10, py - 8, px + 20, py + 4); g.stroke(); }
          else { circ(px, py, 4 + i, 'rgba(140,130,120,.8)'); circ(px + 5, py + 2, 3, 'rgba(170,160,150,.8)'); }
        }
        g.globalAlpha = 1;
      }
      // sūcēja galva

/* ---------- printeris: drukā, iestrēgst, izvelc ---------- */
function makePrinter() {
  const p = {
    ph: 'idle', t: 0, out: 0, jamY: 0, drag: false, sheets: 0, done: false,
    down(x, y) {
      if (this.ph === 'idle' && inR(x, y, R(160, 140, 280, 200))) { this.ph = 'print'; this.t = 0; sfx('print'); progress(); }
      else if (this.ph === 'jam' && inR(x, y, R(200, 60, 200, 140))) { this.drag = true; this.y0 = y; }
    },
    move(x, y, d) { if (this.drag && d) { this.jamY = Math.max(0, this.y0 - y); if (this.jamY > 90) { this.drag = false; this.ph = 'go'; this.t = 0; sfx('paper'); progress(); } } },
    up() { this.drag = false; if (this.ph === 'jam') this.jamY = 0; },
    update(dt) {
      this.t += dt;
      if (this.ph === 'print') { this.out = Math.min(.45, this.t * .6); if (this.t > .9) { this.ph = 'jam'; sfx('rattle'); sfx('bad'); } }
      if (this.ph === 'go') { const n = Math.floor(this.t / .32); if (n > this.sheets && this.sheets < 10) { this.sheets = n; sfx('print'); } if (this.sheets >= 10 && this.t > 3.6) { this.done = true; } }
    },
    draw() {
      box(0, 0, W, H, '#e8dccb'); box(0, 420, W, 180, '#d5c4a1');
      box(150, 200, 300, 200, '#d5d8dc', 18); box(170, 220, 260, 40, '#aab7b8', 8); box(190, 330, 220, 16, '#566573', 6); circ(410, 300, 10, this.ph === 'jam' ? '#e74c3c' : '#27ae60');
      if (this.ph === 'print' || this.ph === 'jam') {
        const top = 220 - this.out * 200 - this.jamY;
        g.save(); g.translate(300, top + 60); if (this.ph === 'jam') g.rotate(Math.sin(TT * 20) * .02);
        box(-80, -60, 160, 120, '#fdfefe', 3); for (let i = 0; i < 5; i++) ln(-60, -40 + i * 18, 40, -40 + i * 18, '#bdc3c7', 2); if (this.ph === 'jam') { ln(-80, 40, 80, 20, 'rgba(0,0,0,.2)', 2); ln(-80, 10, 80, 50, 'rgba(0,0,0,.15)', 2); }
        g.restore();
      }
      for (let i = 0; i < this.sheets; i++) { const lab = i % 2; box(470 + (i % 2) * 8, 400 - i * 6, 100, 70, lab ? '#fff' : '#fdfefe', 3); if (lab) box(470 + 8, 400 - i * 6, 100, 12, '#e67e22', 3); }
      if (this.ph === 'idle') { txtO('Spied printeri — drukāt pasūtījumus! 🖨', 300, 120, 24, '#fff', '#2b2420'); ring(300, 300, 160 + Math.sin(TT * 5) * 6, 'rgba(255,255,255,.6)', 4); }
      if (this.ph === 'jam') { txtO('Papīrs iestrēga! Velc to uz augšu ⬆', 300, 40, 24, '#fff', '#c0392b'); arrow(300, 120 - this.jamY + Math.sin(TT * 6) * 6, -Math.PI / 2, '#c2410c', 1.3); }
      if (this.ph === 'go') txtO('Drukā: ' + Math.min(10, this.sheets) + '/10 (5 pasūtījumi + 5 uzlīmes)', 300, 60, 21, '#fff', '#2b2420');
    },
    auto() { if (this.ph === 'idle') this.down(300, 300); else if (this.ph === 'jam') { this.down(300, 150); this.move(300, 20, true); } }
  };
  return p;
}

const LK = { x: 172, y: 100, cw: 64, uh: 52 };

    let nL = 0; this.par = ps.map((p, i) => { let size = p.size; if (size === 3 && ++nL > 2) size = 2; return { ...p, size, i, slot: null, x: 0, y: 0, drag: false }; });
    this.slots = []; LK_COLS.forEach((col, c) => { let r = 0; col.forEach(h => { this.slots.push({ c, r, h, occ: true, par: null }); r += h; }); });
    // brīvas: tieši vajadzīgie izmēri + divas liekas
    const need = this.par.map(p => p.size).concat([1, 2]);
    for (const s of shuffle(this.slots.slice())) { const k = need.indexOf(s.h); if (k >= 0) { s.occ = false; need.splice(k, 1); } }
    this.layoutGround(); this.drag = null; this.fin = false; this.closeT = 0; this.waste = 0;
    ui.task('Ieliec katru paku brīvā nodalījumā, kurā tā ietilpst.', 'Velc paku uz atvērtu durtiņu. Lielai pakai vajag lielu nodalījumu!');

  layoutGround() { let x = 40; this.par.forEach(p => { if (p.slot) return; const sz = this.pSize(p); if (!p.drag) { p.x = x + sz.w / 2; p.y = 590 - sz.h / 2; } x += 98; }); },
  down(x, y) {
    if (this.fin) return;
    for (const p of this.par) {
      const sz = this.pSize(p);
      if (Math.abs(x - p.x) < sz.w / 2 + 6 && Math.abs(y - p.y) < sz.h / 2 + 6) {
        if (p.slot) { p.slot.par = null; p.slot = null; sfx('paper'); }

      }

  },
  move(x, y, d) { if (this.drag && d) { this.drag.x = x - this.drag.dx; this.drag.y = y - this.drag.dy; } },
  up() {
    const p = this.drag; if (!p) return; this.drag = null; p.drag = false;
    const s = this.slots.find(s => inR(p.x, p.y, this.slotR(s)));
    if (s && !s.occ && !s.par) {
      if (p.size > s.h) { sfx('bad'); ui.toast('Nelien iekšā! Vajag lielāku nodalījumu.'); }
      else { s.par = p; p.slot = s; const r = this.slotR(s); p.x = r.x + r.w / 2; p.y = r.y + r.h / 2; sfx('klunk'); progress(); if (p.size < s.h) ui.toast('Ietilpst, bet vieta mazliet izšķiesta 🙂'); }
    } else if (s && (s.occ || s.par)) { sfx('bad'); ui.toast(s.occ ? 'Šis nodalījums ir aizņemts.' : 'Tur jau ir paka.'); }
    this.layoutGround();
    if (this.par.every(q => q.slot)) this.finish();
  },
  finish() {
    if (this.fin) return; this.fin = true; this.waste = this.par.filter(p => p.size < p.slot.h).length;
    for (let i = 0; i < this.par.length; i++) setTimeout(() => sfx('klunk'), 200 + i * 220);
